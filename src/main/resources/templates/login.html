<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — David Auto Brilho</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0d0d0d; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #161616; border: 1px solid rgba(255,215,0,0.3); padding: 40px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #ffd700; margin-bottom: 20px; text-transform: uppercase; font-size: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #ffd700, #cca000); border: none; border-radius: 8px; font-weight: 700; color: #000; cursor: pointer; text-transform: uppercase; }
        .erro { color: #ff4d4d; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2><i class="fa-solid fa-lock"></i> Acesso Restrito</h2>
    <div th:if="${erro}" class="erro" th:text="${erro}"></div>
    <form action="/login" method="post">
        <input type="password" name="senha" placeholder="Digite a Senha do Admin" required>
        <button type="submit">Entrar no Painel</button>
    </form>
</div>
</body>
</html>
