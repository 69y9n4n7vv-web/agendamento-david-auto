<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Auto Brilho — Agendamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, rgba(0,0,0,0.88), rgba(15,15,15,0.94)),
            url('https://images.unsplash.com/photo-1607860108855-64acf2078ed9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }
        .card {
            width: 100%; max-width: 500px;
            background: rgba(20,20,20,0.95);
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,215,0,0.35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        h1 { color: #ffd700; font-size: 24px; font-weight: 800; text-align: center; text-transform: uppercase; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 20px; }

        /* Barra de Progresso das Abas */
        .step-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
        }
        .step-bar::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px;
            background: #333; z-index: 1; transform: translateY(-50%);
        }
        .step-item {
            position: relative; z-index: 2; background: #141414; padding: 0 10px;
            font-size: 12px; font-weight: 600; color: #666; display: flex; align-items: center; gap: 6px;
        }
        .step-number {
            width: 24px; height: 24px; border-radius: 50%; background: #222; border: 1px solid #444;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #aaa;
        }
        .step-item.active { color: #ffd700; }
        .step-item.active .step-number { background: #ffd700; color: #000; border-color: #ffd700; font-weight: 800; }

        .alert-error {
            background: rgba(220,53,69,0.2); border: 1px solid #dc3545; color: #ff6b6b;
            padding: 10px 15px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #ffd700; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }

        input[type="text"], input[type="tel"], input[type="date"], select {
            width: 100%; padding: 12px 15px; background: #161616; border: 1px solid #333;
            border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: #ffd700; }

        /* Estilização Customizada do Calendário */
        .date-picker-wrapper {
            position: relative;
        }
        input[type="date"] {
            color-scheme: dark;
            cursor: pointer;
            border: 1px solid #007bff;
        }
        .calendar-info {
            font-size: 11px;
            color: #3b82f6;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Botões Seletores de Veículo e Serviço */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-card {
            background: #161616; border: 1px solid #333; border-radius: 8px; padding: 14px;
            text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .option-card i { font-size: 22px; color: #aaa; }
        .option-card span { font-size: 13px; font-weight: 600; color: #ccc; }
        .option-card input[type="radio"] { display: none; }

        .option-card.active {
            border-color: #ffd700; background: rgba(255,215,0,0.1);
        }
        .option-card.active i, .option-card.active span { color: #ffd700; }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        /* Estilo dos Botões de Ação */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        button.btn-next, button.btn-submit {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #ffd700, #cca000);
            border: none; border-radius: 8px; font-weight: 700; color: #000;
            text-transform: uppercase; cursor: pointer; font-size: 14px; transition: 0.2s;
        }
        button.btn-prev {
            width: 35%; padding: 14px; background: #222; border: 1px solid #444;
            border-radius: 8px; font-weight: 600; color: #ccc; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        button.btn-next:hover, button.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,215,0,0.3); }
        button.btn-prev:hover { background: #333; color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <h1><i class="fa-solid fa-car-wash"></i> David Auto Brilho</h1>
    <p class="subtitle">Agendamento Exclusivo de Fim de Semana</p>

    <!-- Indicador de Passos -->
    <div class="step-bar">
        <div class="step-item active" id="step1-indicator">
            <span class="step-number">1</span> Seus Dados
        </div>
        <div class="step-item" id="step2-indicator">
            <span class="step-number">2</span> Agendamento
        </div>
    </div>

    <div th:if="${erro}" class="alert-error" th:text="${erro}"></div>

    <form action="/agendar" method="post" id="formAgendamento">

        <!-- ABA 1: DADOS PESSOAIS -->
        <div class="tab-content active" id="aba1">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nome Completo:</label>
                <input type="text" id="nomeCliente" name="nomeCliente" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> WhatsApp / Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(79) 99999-9999" required onkeyup="mascaraTelefone(this)">
            </div>

            <button type="button" class="btn-next" onclick="proximaAba()">Avançar <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- ABA 2: AGENDAMENTO (VEÍCULO, SERVIÇO, DATA E HORA) -->
        <div class="tab-content" id="aba2">
            <!-- Seleção de Veículo -->
            <div class="form-group">
                <label><i class="fa-solid fa-car"></i> Tipo de Veículo:</label>
                <div class="options-grid">
                    <label class="option-card active" onclick="selecionarVeiculo(this, 'Carro')">
                        <input type="radio" name="tipoVeiculo" value="Carro" checked>
                        <i class="fa-solid fa-car-side"></i>
                        <span>Carro</span>
                    </label>
                    <label class="option-card" onclick="selecionarVeiculo(this, 'Moto')">
                        <input type="radio" name="tipoVeiculo" value="Moto">
                        <i class="fa-solid fa-motorcycle"></i>
                        <span>Moto</span>
                    </label>
                </div>
            </div>

            <!-- Seleção de Serviço -->
            <div class="form-group">
                <label><i class="fa-solid fa-spray-can-sparkles"></i> Opção de Lavagem:</label>
                <div class="options-grid" id="servicosContainer">
                    <label class="option-card active" onclick="selecionarServico(this)">
                        <input type="radio" name="servico" value="Completa" checked>
                        <i class="fa-solid fa-soap"></i>
                        <span id="labelCompleta">Lavagem Completa — R$ 60</span>
                    </label>
                    <label class="option-card" id="cardSecundario" onclick="selecionarServico(this)" style="display:none;">
                        <input type="radio" name="servico" value="Detalhada">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span id="labelSecundario">Lavagem Detalhada — R$ 30</span>
                    </label>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-day"></i> Data do Agendamento:</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="data" name="data" required onchange="validarApenasFimDeSemana(this)">
                    </div>
                    <div class="calendar-info">
                        <i class="fa-solid fa-info-circle"></i> Disponível apenas Sábados e Domingos
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-clock"></i> Horário:</label>
                    <select name="hora" id="selectHora" required>
                        <option value="08:00">08:00</option>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="13:00">13:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-prev" onclick="abaAnterior()"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-check-circle"></i> Agendar</button>
            </div>
        </div>

    </form>
</div>

<script>
    // Configura a data mínima no calendário para a data atual
    const inputData = document.getElementById('data');
    const hoje = new Date().toISOString().split('T')[0];
    inputData.min = hoje;

    // Navegação entre Abas
    function proximaAba() {
        const nome = document.getElementById('nomeCliente').value.trim();
        const telefone = document.getElementById('telefone').value.trim();

        if (!nome || !telefone) {
            alert('Por favor, preencha o seu Nome e o seu Telefone antes de continuar.');
            return;
        }

        document.getElementById('aba1').classList.remove('active');
        document.getElementById('aba2').classList.add('active');
        document.getElementById('step1-indicator').classList.remove('active');
        document.getElementById('step2-indicator').classList.add('active');
    }

    function abaAnterior() {
        document.getElementById('aba2').classList.remove('active');
        document.getElementById('aba1').classList.add('active');
        document.getElementById('step2-indicator').classList.remove('active');
        document.getElementById('step1-indicator').classList.add('active');
    }

    // Validação de Sábados/Domingos e Verificação de Horários Ocupados
    function validarApenasFimDeSemana(input) {
        if (!input.value) return;
        const partes = input.value.split('-');
        const dataDigitada = new Date(partes[0], partes[1] - 1, partes[2]);
        const diaSemana = dataDigitada.getDay(); // 0 = Domingo, 6 = Sábado

        if (diaSemana !== 0 && diaSemana !== 6) {
            alert('Atenção: Por favor, selecione um SÁBADO ou DOMINGO.');
            input.value = '';
            resetarHorarios();
            return;
        }

        carregarHorariosOcupados(input.value);
    }

    function resetarHorarios() {
        const selectHora = document.getElementById('selectHora');
        Array.from(selectHora.options).forEach(option => {
            option.disabled = false;
            option.text = option.value;
        });
    }

    function carregarHorariosOcupados(dataSelecionada) {
        const selectHora = document.getElementById('selectHora');

        resetarHorarios();

        fetch(`/horarios-ocupados?data=${dataSelecionada}`)
            .then(response => response.json())
            .then(horariosOcupados => {
                Array.from(selectHora.options).forEach(option => {
                    if (horariosOcupados.includes(option.value)) {
                        option.disabled = true;
                        option.text = option.value + ' (Indisponível)';
                    }
                });

                // Seleciona automaticamente o primeiro horário vago
                const primeiroDisponivel = Array.from(selectHora.options).find(opt => !opt.disabled);
                if (primeiroDisponivel) {
                    selectHora.value = primeiroDisponivel.value;
                } else {
                    selectHora.value = "";
                }
            })
            .catch(err => console.error('Erro ao buscar horários:', err));
    }

    // Seleção de Veículo e atualização dos rótulos de preços
    function selecionarVeiculo(el, tipo) {
        document.querySelectorAll('input[name="tipoVeiculo"]').forEach(r => r.parentElement.classList.remove('active'));
        el.classList.add('active');
        el.querySelector('input').checked = true;

        const cardSecundario = document.getElementById('cardSecundario');
        const labelCompleta = document.getElementById('labelCompleta');
        const labelSecundario = document.getElementById('labelSecundario');

        if (tipo === 'Moto') {
            cardSecundario.style.display = 'flex';
            labelCompleta.innerText = 'Lavagem Simples — R$ 20';
            labelSecundario.innerText = 'Lavagem Detalhada — R$ 30';
            document.querySelectorAll('input[name="servico"]')[0].value = 'Simples';
        } else {
            cardSecundario.style.display = 'none';
            labelCompleta.innerText = 'Lavagem Completa — R$ 60';
            document.querySelectorAll('input[name="servico"]')[0].value = 'Completa';
            document.querySelectorAll('input[name="servico"]')[0].checked = true;
            selecionarServico(document.querySelectorAll('#servicosContainer .option-card')[0]);
        }
    }

    // Seleção visual de Serviço
    function selecionarServico(el) {
        document.querySelectorAll('input[name="servico"]').forEach(r => r.parentElement.classList.remove('active'));
        el.classList.add('active');
        el.querySelector('input').checked = true;
    }

    // Máscara Telefone
    function mascaraTelefone(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
        v = v.replace(/(\d)(\d{4})$/, "$1-$2");
        input.value = v;
    }
</script>

</body>
</html>
