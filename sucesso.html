<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Confirmado — David Auto Brilho</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(15,15,15,0.92)),
      url('https://images.unsplash.com/photo-1607860108855-64acf2078ed9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 15px;
    }
    .container {
      width: 100%; max-width: 520px; background: rgba(20,20,20,0.94);
      backdrop-filter: blur(10px); padding: 40px 30px; border-radius: 16px;
      border: 1px solid rgba(255,215,0,0.4); text-align: center;
    }
    .icon-success { font-size: 60px; color: #25d366; margin-bottom: 15px; }
    h1 { color: #ffd700; font-size: 24px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
    p.subtitle { color: #ccc; font-size: 14px; margin-bottom: 25px; }
    .ticket-card { background: #161616; border: 1px dashed rgba(255,215,0,0.5); border-radius: 12px; padding: 20px; text-align: left; margin-bottom: 25px; }
    .ticket-header { font-size: 12px; text-transform: uppercase; color: #ffd700; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .ticket-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #aaa; }
    .ticket-row span.val { color: #fff; font-weight: 600; }
    .ticket-highlight { background: rgba(255,215,0,0.1); border-radius: 8px; padding: 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
    .ticket-highlight .label { color: #ffd700; font-weight: 600; font-size: 13px; }
    .ticket-highlight .date-time { color: #fff; font-weight: 700; font-size: 15px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; text-transform: uppercase; }
    .btn-primary { background: linear-gradient(135deg, #ffd700, #cca000); color: #000; }
    .btn-whatsapp { background-color: #25d366; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <i class="fa-solid fa-circle-check icon-success"></i>
  <h1>Agendamento Confirmado!</h1>
  <p class="subtitle">Obrigado! Seu horário foi reservado no David Auto Brilho.</p>

  <div class="ticket-card">
    <div class="ticket-header"><i class="fa-solid fa-receipt"></i> Detalhes da Reserva</div>
    <div class="ticket-row"><span>Cliente:</span><span class="val" th:text="${nomeCliente}">João Silva</span></div>
    <div class="ticket-row"><span>Telefone:</span><span class="val" th:text="${telefone}">(79) 99999-9999</span></div>
    <div class="ticket-row"><span>Serviço:</span><span class="val" th:text="${tipoVeiculo + ' — ' + servico}">Carro — Completa</span></div>
    <div class="ticket-highlight">
      <span class="label"><i class="fa-regular fa-calendar-check"></i> Data & Hora:</span>
      <span class="date-time" th:text="${dataStr + ' às ' + horaStr}">28/09/2026 às 10:00</span>
    </div>
  </div>

  <div class="btn-group">
    <a th:href="'https://wa.me/5579999248255?text=Olá!%20Fiz%20um%20agendamento%20para%20o%20dia%20' + ${dataStr} + '%20às%20' + ${horaStr} + '%20no%20nome%20de%20' + ${nomeCliente}"
       target="_blank" class="btn btn-whatsapp">
      <i class="fa-brands fa-whatsapp"></i> Confirmar via WhatsApp
    </a>
    <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Novo Agendamento</a>
  </div>
</div>

</body>
</html>
